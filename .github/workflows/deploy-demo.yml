name: Publicar demo web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Preparar y validar juego
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener repositorio y recursos LFS
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Comprobar el empaquetador
        run: node --test scripts/pages/build.test.mjs

      - name: Preparar copia web y revisar recursos
        run: node scripts/pages/build.mjs

      - name: Verificar artefacto bajo la ruta del repositorio
        run: node scripts/pages/verify.mjs

      - name: Publicar informe en el resumen
        if: always()
        shell: bash
        run: |
          if [ -f .pages-build/report.md ]; then
            cat .pages-build/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar artefacto de Pages
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .pages-build/site
          retention-days: 1

  deploy:
    name: Publicar en GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Comprobar configuración de Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false

      - name: Desplegar demo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
